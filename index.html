<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>철의 왕관 | 실시간 3D 왕국</title>
<style>
:root{color-scheme:dark;--ink:#f3e8d1;--muted:#b7ad95;--gold:#e4bd70;--line:#564831;--panel:#22241d;--bg:#171914}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button,input,select{border:1px solid var(--line);border-radius:5px;color:inherit;background:#2c2b22;padding:8px 12px}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--gold);background:#413726}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.gold{background:#d8ad60;color:#221a0d;font-weight:750}.gold:hover:not(:disabled){background:#f1c779}.danger{background:#592d25;border-color:#995342}.sub,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,"Batang",serif}h1{font-size:31px;letter-spacing:.08em}h2{font-size:24px}h3{font-size:16px}.wrap{max-width:1430px;margin:auto;padding:0 28px 34px}header{min-height:90px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.brand{display:flex;align-items:center;gap:15px}.crest{display:grid;place-items:center;width:48px;height:54px;background:#38301f;color:var(--gold);font-size:29px;border:1px solid #8d7040;border-radius:4px 4px 20px 20px}.status{color:#b6d1a4;text-align:right}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:20px 0;border-radius:7px;overflow:hidden}.stats div{background:var(--panel);padding:8px 14px}.stats strong{display:block;font-size:21px;font-variant-numeric:tabular-nums;color:var(--gold)}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.heading{padding:14px 19px;border-bottom:1px solid var(--line)}.heading.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.map{position:relative;aspect-ratio:1.62;background:#2a392f;overflow:hidden;isolation:isolate}canvas{position:absolute;width:100%;height:100%}.castle{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;gap:2px;padding:0;border:0;background:transparent;white-space:nowrap;color:var(--flag);text-shadow:0 2px 3px #000}.castle:hover:not(:disabled){background:transparent}.castle i{display:grid;place-items:center;font:normal 27px/1 system-ui;width:43px;height:43px;border-radius:50%;border:1px solid currentColor;background:#202720;box-shadow:0 3px 10px #0008}.castle[aria-pressed=true] i{outline:2px solid currentColor;outline-offset:4px}.castle b{border-radius:4px;background:#161b16eb;padding:2px 6px;font-size:13px}.compass{position:absolute;right:18px;bottom:12px;color:#efe3bf;font:24px/1 Georgia;text-align:center;text-shadow:0 2px 3px #000;pointer-events:none}.compass small{display:block;font-size:12px;color:inherit}.caption{padding:9px 18px;color:var(--muted)}aside{display:grid;gap:14px}.content{padding:14px 16px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.actions{display:grid;gap:7px}.actions button{text-align:left}.actions button span{float:right;color:var(--muted);font-size:12px}.form{display:grid;gap:10px}.form label{display:grid;gap:3px}.form input,.form select{min-width:0;width:100%}.alert{margin:10px 0;color:#ffca95;min-height:1.55em}.record{margin-top:16px}.record ol{list-style:none;padding:0 16px;margin:0;max-height:180px;overflow:auto}.record li,.offer{padding:8px 0;border-bottom:1px solid #3d3b2e}.record li:last-child{border:0}.end{background:#3c301f;border:1px solid var(--gold);padding:10px 16px;margin-bottom:14px;border-radius:5px}.units{width:84px}.label{color:var(--gold)}[hidden]{display:none!important}
@media(max-width:850px){main{grid-template-columns:1fr}.wrap{padding:0 14px 24px}.map{aspect-ratio:1.4}.heading{padding:10px 14px}}
@media(max-width:475px){.stats div{padding:6px}.stats small{font-size:10px}.stats strong{font-size:17px}h1{font-size:23px}.crest{width:35px;height:42px}header{min-height:73px}.brand{gap:8px}.castle i{width:33px;height:33px;font-size:20px}.castle b{font-size:11px}.status{font-size:12px}}

[hidden]{display:none!important}.realm-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}.gate{margin:16px 0}.gate .content{grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:20px}.gate .form{max-width:430px}.map{aspect-ratio:1.65;background:linear-gradient(#a8b9b3,#495c3d);min-height:300px}.map canvas{display:block;touch-action:none}.world-label{position:absolute;z-index:1;transform:translate(-50%,-50%);white-space:nowrap;color:var(--flag);background:#1c231ae8;padding:3px 8px;font-size:13px;font-weight:700}.world-label.near{border-color:var(--gold)}.world-error{position:absolute;inset:16px;color:#211b13}.shortcuts kbd{color:var(--gold)}.modal{max-width:min(680px,95vw);width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:19px}.modal::backdrop{background:#10100acc}.modal table{width:100%;border-collapse:collapse;margin-top:12px;text-align:right}.modal th,.modal td{padding:8px;border-bottom:1px solid var(--line)}.modal th:first-child{text-align:left}.modal .scroll{overflow:auto}.actions span{margin-left:8px}.caption .row{width:100%}
@media(max-width:600px){.map{min-height:320px}.shortcuts{font-size:12px}.modal th,.modal td{font-size:12px;padding:6px}}
</style>
<link rel="stylesheet" href="./experience.css">
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="crest" aria-hidden="true">♛</div><div><h1>철의 왕관</h1><p class="sub">실시간 3D 왕국</p></div></div><div class="status" id="connection" role="status">서버 연결 중</div></header>
<section id="signin" class="box gate">
  <div class="heading"><h2>로그인</h2></div>
  <div class="content">
    <form class="form" id="emailForm">
      <label>이메일<input id="email" type="email" autocomplete="email" required></label>
      <label>비밀번호<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
      <div class="row"><button class="gold" value="login">이메일 로그인</button><button value="signup">회원가입</button></div>
    </form>
    <div class="actions"><button id="google">Google로 로그인</button><button id="guest">익명으로 시작</button></div>
  </div>
</section>
<div id="roomGate" class="box gate" hidden>
  <div class="heading"><div class="row"><h2>왕국에 입장</h2><button data-signout>로그아웃</button></div></div>
  <div class="content">
    <form id="roomForm" class="form"><label>초대 코드<input id="roomCode" maxlength="12" pattern="[A-Fa-f0-9]{12}" autocomplete="off" required></label><button>방 접속</button></form>
    <div class="actions"><button id="createRoom" class="gold">새 방 만들기</button></div>
  </div>
</div>
<p id="feedback" class="alert" role="status"></p>
<div id="play" hidden>
<div class="realm-bar">
<div class="room-identity"><span class="realm-mark" aria-hidden="true">♛</span><div><strong>철의 왕관</strong><small id="activeRoom"></small></div><small id="occupancy"></small></div>
<div class="realm-actions"><button id="copyInvite">초대 링크</button><button id="statsButton">통계 <kbd>P</kbd></button><button id="panelButton" aria-controls="management" aria-expanded="true">왕국 관리</button><button id="fullscreen" aria-pressed="false">전체화면 <kbd>F</kbd></button><button id="leaveRoom">나가기</button></div>
</div>
<section class="stats" aria-label="내 영지 자원">
<div><small>금화</small><strong id="gold">—</strong></div><div><small>식량</small><strong id="food">—</strong></div><div><small>주둔 병력</small><strong id="army">—</strong></div><div><small>명성</small><strong id="fame">—</strong></div><div><small>백성</small><strong id="citizens">—</strong></div>
</section>
<p id="winner" class="end" hidden></p>
<main>
<div>
<section class="world-view" aria-label="3D 왕국">
<div class="map" id="map"></div>
<div class="caption"><p class="shortcuts"><kbd>WASD</kbd> 이동 <kbd>Shift</kbd> 웅크리기 <kbd>Space</kbd> 점프 <kbd>E</kbd> 가까운 성 <span class="mouse-hint">· 드래그 시점 전환 · 휠 확대/축소</span></p></div></section>
<details class="box record"><summary>왕국 연대기</summary><ol id="logs"><li class="sub">아직 기록이 없습니다.</li></ol></details>
</div>
<aside id="management">
<section class="box" id="lobby"><div class="heading"><h2>영주로 입장</h2></div><form id="join" class="content form">
<label>영주 이름<input id="lord" required maxlength="16" placeholder="이름 입력" autocomplete="nickname"></label>
<label>시작할 성<select id="seat" required></select></label>
<button class="gold" id="joinButton" disabled>영지에 부임</button><small>왕국은 네 곳입니다. 플레이어가 선택하지 않은 성은 AI 왕이 다스립니다.</small>
</form></section>
<section class="box" id="estate" hidden><div class="heading"><h2 id="home"></h2><small id="levels"></small></div><div class="content actions">
<button data-action="train">군사 훈련 <span id="trainCost"></span></button>
<button data-action="farm">농지 확장 <span id="farmCost"></span></button>
<button data-action="wall">성벽 강화 <span id="wallCost"></span></button>
</div></section>
<section class="box"><div class="heading"><h2 id="target">성 정보</h2><small id="region"></small></div>
<div class="content" id="details"><label>왕국 선택 <select id="targetSelect"></select></label><p id="owner"></p><p id="defense" class="sub"></p><p id="relation" class="label"></p>
<div class="actions" id="diplomacy" hidden>
<button data-action="alliance">수교 제안 <span>백성 간 교역 개시</span></button>
<button data-action="break" hidden>수교 종료</button>
<button data-action="trade">교역 제안 <span>내 식량 30 ↔ 상대 금화 24</span></button>
<button data-action="truce">휴전 제안 <span>2분간 상호 공격 금지</span></button>
<form id="attack" class="row"><label>출정 병력 <input class="units" id="units" type="number" min="10" value="30" required></label><button class="danger">출정</button></form>
<small id="marchHint">식량 25 · 12초 뒤 도착</small>
</div></div></section>
<section class="box" id="mail" hidden><div class="heading"><h3>외교 제안</h3></div><div class="content" id="offers"></div></section>
</aside>
</main>
</div>
</div>
<dialog class="modal" id="statsDialog">
<div class="row"><h2>왕국 통계</h2><form method="dialog"><button>닫기</button></form></div>
<p id="economicClock" class="sub"></p>
<div class="scroll"><table><thead><tr><th scope="col">항목</th><th scope="col">내 왕국</th></tr></thead><tbody id="statRows"></tbody></table></div>
<p class="sub">국민소득은 세후 판매 수익입니다. 판매 수익의 10%가 국고에 들어갑니다.</p>
</dialog>
<script type="module" src="./game.mjs"></script>
</body>
</html>
